media:
  input: public/acervo
  output: /acervo

content:
  - name: colecoes
    label: Coleções
    type: collection
    path: src/content/colecoes
    format: json
    view:
      fields: [name, order]
      primary: name
      sort: [order, name]
    fields:
      - name: name
        label: Nome da Coleção
        type: string
        required: true
      - name: description
        label: Descrição / Ementa
        type: text
      - name: parentCollection
        label: Coleção Pai (opcional, para subcoleções)
        type: reference
        options:
          collection: colecoes
      - name: order
        label: Ordem de exibição
        type: number
        default: 1

  - name: ebooks
    label: E-books
    type: collection
    path: src/content/ebooks
    format: json
    view:
      fields: [title, collection, year, published]
      primary: title
      sort: [created_at, title]
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: subtitle
        label: Subtítulo
        type: string
      - name: collection
        label: Coleção
        type: reference
        required: true
        options:
          collection: colecoes
      - name: authors
        label: Autores / Organizadores
        type: list
        required: true
      - name: keywords
        label: Palavras-chave
        type: list
      - name: description
        label: Sinopse / Descrição
        type: text
        required: true
      - name: authorship
        label: Autoria (Minibiografia)
        type: text
      - name: summary
        label: Sumário
        type: text
      - name: publisher
        label: Editora
        type: string
        default: Cronópios Selo Editorial
      - name: year
        label: Ano de publicação
        type: number
        required: true
      - name: edition
        label: Edição
        type: string
        default: 1ª
      - name: pages
        label: Páginas
        type: number
      - name: format
        label: Formato
        type: string
        default: PDF (eBook)
      - name: isbn
        label: ISBN
        type: string
      - name: cover
        label: Capa do eBook
        type: image
        required: true
        options:
          extensions: [jpg, jpeg, png, webp]
      - name: pdf
        label: Arquivo PDF do eBook
        type: file
        required: true
        options:
          extensions: [pdf]
      - name: created_at
        label: Data de adição ao catálogo
        type: date
        required: true
      - name: published
        label: Publicado no site?
        type: boolean
        default: true
