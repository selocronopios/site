media:
  - name: capas
    label: Capas dos E-books
    input: public/acervo/capas
    output: /acervo/capas
    categories: [image]
  - name: ebooks
    label: E-books (PDF)
    input: public/acervo/ebooks
    output: /acervo/ebooks
    extensions: [pdf]

content:
  - name: colecoes
    label: Coleções
    type: collection
    path: src/content/colecoes
    format: json
    filename: '{primary}.json'
    view:
      fields: [titulo, ordem]
      primary: titulo
      sort: [ordem, titulo]
    fields:
      - name: titulo
        label: Nome da Coleção
        type: string
        required: true
      - name: descricao
        label: Descrição / Ementa
        type: text
      - name: colecaoPai
        label: Coleção Pai (opcional, para subcoleções)
        type: reference
        options:
          collection: colecoes
          search: titulo
          value: '{slug}'
      - name: imagem
        label: Imagem / Logo da Coleção
        type: image
        options:
          media: capas
          extensions: [jpg, jpeg, png, webp, svg]
      - name: ordem
        label: Ordem de exibição
        type: number
        default: 1

  - name: ebooks
    label: E-books
    type: collection
    path: src/content/ebooks
    format: json
    filename: '{primary}.json'
    view:
      fields: [title, collection, year, published]
      primary: title
      sort: [created_at, title]
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: subtitle
        label: Subtítulo
        type: string
      - name: collection
        label: Coleção
        type: reference
        required: true
        options:
          collection: colecoes
      - name: authors
        label: Autores / Organizadores
        type: string
        list: true
        required: true
      - name: keywords
        label: Palavras-chave
        type: string
        list: true
      - name: description
        label: Sinopse / Descrição
        type: text
        required: true
      - name: authorship
        label: Autoria (Minibiografia)
        type: text
      - name: summary
        label: Sumário
        type: text
      - name: publisher
        label: Editora
        type: string
        default: Cronópios Selo Editorial
      - name: year
        label: Ano de publicação
        type: number
        required: true
      - name: edition
        label: Edição
        type: string
        default: 1ª
      - name: pages
        label: Páginas
        type: number
      - name: format
        label: Formato
        type: string
        default: PDF (eBook)
      - name: isbn
        label: ISBN
        type: string
      - name: cover
        label: Capa do eBook
        type: image
        required: true
        options:
          media: capas
          extensions: [jpg, jpeg, png, webp]
      - name: pdf
        label: Arquivo PDF do eBook
        type: file
        required: true
        options:
          media: ebooks
          extensions: [pdf]
      - name: created_at
        label: Data de adição ao catálogo
        type: date
        required: true
      - name: published
        label: Publicado no site?
        type: boolean
        default: true
